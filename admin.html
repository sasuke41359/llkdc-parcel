<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Admin Panel — LLKDC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary:     #1d4ed8;
      --primary-dk:  #1e3a8a;
      --primary-lt:  #3b82f6;
      --success:     #16a34a;
      --danger:      #dc2626;
      --warning:     #d97706;
      --bg:          #f0f4ff;
      --surface:     #ffffff;
      --border:      #e2e8f0;
      --text:        #1e293b;
      --muted:       #64748b;
      --shadow:      0 4px 24px rgba(29,78,216,0.08);
      --shadow-lg:   0 8px 40px rgba(29,78,216,0.16);
      --radius:      16px;
      --radius-sm:   10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* ---- Login Screen ---- */
    .login-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .login-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .login-title { font-size: 1.3rem; font-weight: 700; color: var(--primary-dk); margin-bottom: 6px; }
    .login-sub   { font-size: .85rem; color: var(--muted); margin-bottom: 28px; }
    .login-error {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
      padding: 10px; font-size: .85rem; color: var(--danger); margin-bottom: 16px;
      display: none;
    }

    /* ---- App Layout ---- */
    .app-wrap { display: none; max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }

    /* ---- Header ---- */
    .app-header {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    .app-header::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary-dk), var(--primary-lt));
    }
    .app-header-left h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary-dk); }
    .app-header-left p  { font-size: .82rem; color: var(--muted); margin-top: 2px; }

    /* ---- Card ---- */
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 1rem; font-weight: 700; color: var(--primary-dk);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    /* ---- Form ---- */
    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 0; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: .82rem; font-weight: 600; color: var(--text); }
    .form-control {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Sarabun', sans-serif; font-size: .92rem; color: var(--text);
      transition: border-color .2s, box-shadow .2s; background: #fff;
    }
    .form-control:focus { outline: none; border-color: var(--primary-lt); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border-radius: var(--radius-sm); border: none; cursor: pointer;
      font-family: 'Sarabun', sans-serif; font-size: .9rem; font-weight: 600;
      transition: all .2s; white-space: nowrap;
    }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dk); }
    .btn-success   { background: var(--success); color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-danger    { background: var(--danger); color: #fff; }
    .btn-danger:hover  { background: #b91c1c; }
    .btn-outline   { background: #f1f5f9; color: var(--text); border: 1.5px solid var(--border); }
    .btn-outline:hover { background: #e2e8f0; }
    .btn-warning   { background: #fef3c7; color: var(--warning); border: 1.5px solid #fde68a; }
    .btn-warning:hover { background: #fde68a; }
    .btn-sm { padding: 7px 12px; font-size: .8rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; margin: 0 -4px; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 500px; }
    thead th {
      background: #f8fafc; padding: 10px 12px; text-align: left;
      font-weight: 600; color: var(--muted); border-bottom: 1.5px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .15s; }
    tbody tr:hover { background: #f8faff; }
    tbody td { padding: 10px 12px; vertical-align: middle; }

    /* ---- Inline edit ---- */
    .editing td { background: #fffbeb !important; }
    .edit-input {
      width: 100%; padding: 6px 8px; border: 1.5px solid var(--primary-lt);
      border-radius: 6px; font-family: 'Sarabun', sans-serif; font-size: .88rem;
    }

    /* ---- Badge ---- */
    .badge-count {
      display: inline-block; background: var(--primary); color: #fff;
      border-radius: 99px; padding: 2px 10px; font-size: .75rem; font-weight: 700;
      margin-left: 6px;
    }

    /* ---- Empty ---- */
    .empty-state { text-align: center; padding: 32px; color: var(--muted); }
    .empty-state i { font-size: 2rem; margin-bottom: 8px; display: block; opacity: .4; }

    /* ---- Toast ---- */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 99px;
      font-size: .88rem; font-weight: 500; transition: transform .3s ease;
      z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.danger  { background: var(--danger); }

    /* ---- Overlay ---- */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none !important; }
    .modal {
      background: var(--surface); border-radius: var(--radius);
      padding: 28px; width: 95vw; max-width: 400px;
      box-shadow: var(--shadow-lg); text-align: center;
    }

    .hidden { display: none !important; }

    /* ---- Search ---- */
    .search-wrap { position: relative; }
    .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .85rem; }
    .search-wrap .form-control { padding-left: 34px; }

    /* ---- Stats ---- */
    .stats-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-chip {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 99px;
      padding: 6px 14px; font-size: .82rem; color: var(--primary-dk); font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h1 class="login-title">Admin Panel</h1>
      <p class="login-sub">ระบบพัสดุ LLKDC — จัดการรายชื่อผู้รับ</p>
      <div class="login-error" id="loginError">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</div>
      <div class="form-group" style="text-align:left;margin-bottom:16px">
        <label class="form-label">รหัสผ่าน</label>
        <input id="passwordInput" type="password" class="form-control" placeholder="ใส่รหัสผ่าน..." autocomplete="current-password" />
      </div>
      <button id="btnLogin" class="btn btn-primary" style="width:100%;padding:12px">
        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <!-- ===== CONFIRM DELETE MODAL ===== -->
  <div id="confirmModal" class="overlay hidden">
    <div class="modal">
      <div style="font-size:2.5rem;margin-bottom:8px">🗑️</div>
      <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:8px">ยืนยันการลบ</h3>
      <p id="confirmMsg" style="color:var(--muted);font-size:.9rem;margin-bottom:20px"></p>
      <div style="display:flex;gap:10px">
        <button id="btnConfirmCancel" class="btn btn-outline" style="flex:1">ยกเลิก</button>
        <button id="btnConfirmDelete" class="btn btn-danger" style="flex:1">ลบ</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== ADMIN APP ===== -->
  <div class="app-wrap" id="appWrap">

    <!-- Header -->
    <div class="app-header">
      <div class="app-header-left">
        <h1><i class="fas fa-shield-alt" style="color:var(--primary);margin-right:8px"></i>Admin Panel — LLKDC</h1>
        <p>จัดการรายชื่อผู้รับพัสดุ</p>
      </div>
      <button id="btnLogout" class="btn btn-outline btn-sm">
        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
      </button>
    </div>

    <!-- Add Form -->
    <div class="card">
      <div class="card-title"><i class="fas fa-user-plus" style="color:var(--success)"></i>เพิ่มผู้รับใหม่</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">ชื่อ-นามสกุล <span style="color:var(--danger)">*</span></label>
          <input id="addName" type="text" class="form-control" placeholder="เช่น สมชาย ใจดี" />
        </div>
        <div class="form-group">
          <label class="form-label">แผนก</label>
          <input id="addDept" type="text" class="form-control" placeholder="เช่น IT, HR, Finance" />
        </div>
        <div class="form-group">
          <label class="form-label">อีเมล</label>
          <input id="addEmail" type="email" class="form-control" placeholder="example@bevchain.co.th" />
        </div>
        <div class="form-group">
          <label class="form-label">&nbsp;</label>
          <button id="btnAdd" class="btn btn-success">
            <i class="fas fa-plus"></i> เพิ่ม
          </button>
        </div>
      </div>
      <div id="addError" style="display:none;color:var(--danger);font-size:.82rem;margin-top:8px"></div>
    </div>

    <!-- List -->
    <div class="card">
      <div class="card-title" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <span>
          <i class="fas fa-users" style="color:var(--primary)"></i>
          รายชื่อผู้รับ
          <span class="badge-count" id="countBadge">0</span>
        </span>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="search-wrap" style="width:200px">
            <i class="fas fa-search"></i>
            <input id="searchInput" type="text" class="form-control" placeholder="ค้นหา..." style="font-size:.85rem;padding:8px 8px 8px 32px">
          </div>
          <button id="btnReload" class="btn btn-outline btn-sm"><i class="fas fa-rotate"></i></button>
        </div>
      </div>

      <div class="stats-row" id="statsRow" style="display:none">
        <span class="stat-chip" id="statTotal">ทั้งหมด 0 คน</span>
        <span class="stat-chip" id="statWithEmail">มีอีเมล 0 คน</span>
        <span class="stat-chip" id="statNoDept">ไม่มีแผนก 0 คน</span>
      </div>

      <div class="table-wrap">
        <table id="mappingTable">
          <thead>
            <tr>
              <th>#</th>
              <th>ชื่อ-นามสกุล</th>
              <th>แผนก</th>
              <th>อีเมล</th>
              <th style="text-align:center;width:140px">จัดการ</th>
            </tr>
          </thead>
          <tbody id="mappingBody">
            <tr><td colspan="5" class="empty-state"><i class="fas fa-spinner fa-spin"></i>กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ===== Firebase + Logic ===== -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ========== Config ==========
    const ADMIN_PASSWORD = 'LLKDC2026'; // ← เปลี่ยนรหัสผ่านได้ที่นี่

    const firebaseConfig = {
      apiKey:            'AIzaSyBjkH6IbKE7blC69WVf_PzxM2WRPSkzYqg',
      authDomain:        'llkdc-parcel.firebaseapp.com',
      projectId:         'llkdc-parcel',
      storageBucket:     'llkdc-parcel.firebasestorage.app',
      messagingSenderId: '151622901641',
      appId:             '1:151622901641:web:375fe3fcf1bf1b7d484b58'
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const $ = id => document.getElementById(id);

    // ========== Toast ==========
    function showToast(msg, type = '') {
      const t = $('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ========== Auth ==========
    const SESSION_KEY = 'llkdc_admin_auth';

    function checkSession() {
      return sessionStorage.getItem(SESSION_KEY) === '1';
    }
    function login() {
      const pw = $('passwordInput').value;
      if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, '1');
        $('loginWrap').style.display = 'none';
        $('appWrap').style.display   = 'block';
        loadMapping();
      } else {
        $('loginError').style.display = 'block';
        $('passwordInput').value = '';
        $('passwordInput').focus();
      }
    }
    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    $('btnLogin').addEventListener('click', login);
    $('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('btnLogout').addEventListener('click', logout);

    // ตรวจ session ตั้งแต่โหลด
    if (checkSession()) {
      $('loginWrap').style.display = 'none';
      $('appWrap').style.display   = 'block';
    }

    // ========== Load Mapping ==========
    let _mappingDocs = []; // { id, name, department, email, order }

    async function loadMapping() {
      const tbody = $('mappingBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</td></tr>';
      try {
        const snap = await getDocs(query(collection(db, 'mapping'), orderBy('order')));
        _mappingDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTable(_mappingDocs);
        updateStats(_mappingDocs);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--danger)">โหลดไม่สำเร็จ: ${err.message}</td></tr>`;
      }
    }

    function updateStats(list) {
      $('countBadge').textContent = list.length;
      $('statTotal').textContent  = `ทั้งหมด ${list.length} คน`;
      $('statWithEmail').textContent = `มีอีเมล ${list.filter(x => x.email).length} คน`;
      $('statNoDept').textContent    = `ไม่มีแผนก ${list.filter(x => !x.department).length} คน`;
      $('statsRow').style.display = list.length ? 'flex' : 'none';
    }

    // ========== Render Table ==========
    function renderTable(list) {
      const tbody = $('mappingBody');
      tbody.innerHTML = '';
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><i class="fas fa-users"></i>ยังไม่มีรายชื่อ</div></td></tr>';
        return;
      }
      list.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.dataset.id = p.id;
        tr.innerHTML = `
          <td style="color:var(--muted);font-size:.82rem">${i + 1}</td>
          <td><strong>${esc(p.name)}</strong></td>
          <td>${p.department ? `<span style="background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:99px;font-size:.78rem">${esc(p.department)}</span>` : '<span style="color:var(--muted);font-size:.82rem">-</span>'}</td>
          <td style="font-size:.85rem">${p.email ? `<a href="mailto:${esc(p.email)}" style="color:var(--primary-lt)">${esc(p.email)}</a>` : '<span style="color:var(--muted)">-</span>'}</td>
          <td style="text-align:center">
            <div style="display:flex;gap:6px;justify-content:center">
              <button class="btn btn-warning btn-sm btnEdit" data-id="${p.id}"><i class="fas fa-pen"></i></button>
              <button class="btn btn-danger btn-sm btnDelete" data-id="${p.id}" data-name="${esc(p.name)}"><i class="fas fa-trash"></i></button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });

      // bind edit/delete
      tbody.querySelectorAll('.btnEdit').forEach(btn => btn.addEventListener('click', () => startEdit(btn.dataset.id)));
      tbody.querySelectorAll('.btnDelete').forEach(btn => btn.addEventListener('click', () => confirmDelete(btn.dataset.id, btn.dataset.name)));
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ========== Search ==========
    $('searchInput').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      const filtered = q
        ? _mappingDocs.filter(p =>
            (p.name       || '').toLowerCase().includes(q) ||
            (p.department || '').toLowerCase().includes(q) ||
            (p.email      || '').toLowerCase().includes(q))
        : _mappingDocs;
      renderTable(filtered);
    });

    $('btnReload').addEventListener('click', loadMapping);

    // ========== Add ==========
    $('btnAdd').addEventListener('click', async () => {
      const name  = $('addName').value.trim();
      const dept  = $('addDept').value.trim();
      const email = $('addEmail').value.trim();
      const errEl = $('addError');

      if (!name) { errEl.textContent = 'กรุณากรอกชื่อ-นามสกุล'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      // เช็คชื่อซ้ำ
      if (_mappingDocs.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        errEl.textContent = `"${name}" มีในรายชื่ออยู่แล้ว`; errEl.style.display = 'block'; return;
      }

      const btn = $('btnAdd');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      try {
        const docId = name.replace(/[^a-zA-Z0-9ก-๙]/g, '_').replace(/_+/g, '_');
        const order = _mappingDocs.length > 0 ? Math.max(..._mappingDocs.map(p => p.order || 0)) + 1 : 1;
        await addDoc(collection(db, 'mapping'), { name, department: dept, email, nickname: '', order });
        $('addName').value = ''; $('addDept').value = ''; $('addEmail').value = '';
        showToast(`✅ เพิ่ม "${name}" สำเร็จ`, 'success');
        await loadMapping();
      } catch (err) {
        showToast('เพิ่มไม่สำเร็จ: ' + err.message, 'danger');
      } finally {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus"></i> เพิ่ม';
      }
    });

    // กด Enter ใน addName/addDept/addEmail
    ['addName','addDept','addEmail'].forEach(id => {
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('btnAdd').click(); });
    });

    // ========== Inline Edit ==========
    let _editingId = null;
    let _editOriginal = {};

    function startEdit(id) {
      if (_editingId) cancelEdit(); // ยกเลิก edit เดิมก่อน
      _editingId = id;
      const p  = _mappingDocs.find(x => x.id === id);
      if (!p) return;
      _editOriginal = { ...p };

      const tr = document.querySelector(`tr[data-id="${id}"]`);
      if (!tr) return;
      tr.classList.add('editing');
      tr.innerHTML = `
        <td style="color:var(--muted);font-size:.82rem">${tr.querySelector('td').textContent}</td>
        <td><input class="edit-input" id="editName"  value="${esc(p.name)}"        placeholder="ชื่อ-นามสกุล" /></td>
        <td><input class="edit-input" id="editDept"  value="${esc(p.department)}"  placeholder="แผนก" /></td>
        <td><input class="edit-input" id="editEmail" value="${esc(p.email)}"       placeholder="อีเมล" type="email" /></td>
        <td style="text-align:center">
          <div style="display:flex;gap:6px;justify-content:center">
            <button class="btn btn-success btn-sm" id="btnSaveEdit"><i class="fas fa-check"></i> บันทึก</button>
            <button class="btn btn-outline btn-sm"  id="btnCancelEdit"><i class="fas fa-times"></i></button>
          </div>
        </td>`;
      $('btnSaveEdit').addEventListener('click',  () => saveEdit(id));
      $('btnCancelEdit').addEventListener('click', cancelEdit);
      $('editName').focus();
    }

    function cancelEdit() {
      _editingId = null;
      renderTable(_mappingDocs);
    }

    async function saveEdit(id) {
      const name  = $('editName').value.trim();
      const dept  = $('editDept').value.trim();
      const email = $('editEmail').value.trim();

      if (!name) { showToast('กรุณากรอกชื่อ-นามสกุล', 'danger'); return; }

      const btn = $('btnSaveEdit');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      try {
        await updateDoc(doc(db, 'mapping', id), { name, department: dept, email });
        showToast(`✅ อัปเดต "${name}" สำเร็จ`, 'success');
        _editingId = null;
        await loadMapping();
      } catch (err) {
        showToast('บันทึกไม่สำเร็จ: ' + err.message, 'danger');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> บันทึก';
      }
    }

    // ========== Delete ==========
    let _deleteId = null;

    function confirmDelete(id, name) {
      _deleteId = id;
      $('confirmMsg').textContent = `ต้องการลบ "${name}" ออกจากรายชื่อ?`;
      $('confirmModal').classList.remove('hidden');
    }

    $('btnConfirmCancel').addEventListener('click', () => {
      _deleteId = null;
      $('confirmModal').classList.add('hidden');
    });

    $('btnConfirmDelete').addEventListener('click', async () => {
      if (!_deleteId) return;
      const btn = $('btnConfirmDelete');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      try {
        const p = _mappingDocs.find(x => x.id === _deleteId);
        await deleteDoc(doc(db, 'mapping', _deleteId));
        $('confirmModal').classList.add('hidden');
        showToast(`🗑️ ลบ "${p?.name || ''}" สำเร็จ`, 'danger');
        _deleteId = null;
        await loadMapping();
      } catch (err) {
        showToast('ลบไม่สำเร็จ: ' + err.message, 'danger');
      } finally {
        btn.disabled = false; btn.innerHTML = 'ลบ';
      }
    });

    // ========== Init ==========
    if (checkSession()) loadMapping();
  </script>
</body>
</html>
