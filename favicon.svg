<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1d4ed8"/>
  <!-- Box body -->
  <rect x="14" y="28" width="36" height="24" rx="3" fill="#ffffff"/>
  <!-- Box lid top -->
  <rect x="12" y="22" width="40" height="8" rx="2" fill="#bfdbfe"/>
  <!-- Ribbon vertical -->
  <rect x="29" y="22" width="6" height="30" fill="#1d4ed8" opacity="0.3"/>
  <!-- Ribbon horizontal -->
  <rect x="14" y="34" width="36" height="5" fill="#1d4ed8" opacity="0.3"/>
  <!-- Bell notification dot -->
  <circle cx="46" cy="18" r="7" fill="#f59e0b"/>
